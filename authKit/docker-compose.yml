services:
  postgres:
    image: postgres:16
    container_name: authkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: authkit_user
      POSTGRES_PASSWORD: authkit_pass_123
      POSTGRES_DB: authkit
    ports:
      - '5433:5432'
    volumes:
      - authkit_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: authkit-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - authkit_redis_data:/data

volumes:
  authkit_postgres_data:
  authkit_redis_data:
